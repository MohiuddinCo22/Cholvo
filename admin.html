<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Cholvo Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--navy:#0B2A5B;--deep:#071A3A;--orange:#F58220;--ink:#12233F;--mist:#F3F6FB;--line:#DCE3EF}
*{box-sizing:border-box;margin:0}
body{font-family:Outfit,system-ui,sans-serif;color:var(--ink);background:var(--mist);line-height:1.45}
button,input,select{font:inherit}
:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
[hidden]{display:none!important}
.top{background:var(--navy);color:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px;position:sticky;top:0;z-index:5}
.top b{font-size:1.1rem}
.btn{border:0;border-radius:10px;padding:10px 16px;font-weight:700;cursor:pointer;background:var(--orange);color:#fff}
.btn.g{background:#fff;color:var(--navy);border:1.5px solid var(--line)}
.btn.r{background:#C62828}
.btn:disabled{opacity:.5}
.wrap{max-width:900px;margin:0 auto;padding:16px}
.login{max-width:380px;margin:60px auto;background:#fff;border:1px solid var(--line);border-radius:18px;padding:24px;display:grid;gap:12px}
.login h1{color:var(--navy);font-size:1.5rem}
label{font-weight:600;font-size:.9rem;display:block;margin-bottom:4px}
input,select{width:100%;padding:11px 13px;border:1.5px solid var(--line);border-radius:10px;background:#fff}
.tabs{display:flex;gap:6px;margin-bottom:12px}
.tabs button{flex:1;border:0;padding:11px;border-radius:10px;font-weight:700;background:#fff;color:#4B5B77;cursor:pointer}
.tabs button.on{background:var(--navy);color:#fff}
.tools{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
@media(min-width:600px){.tools{grid-template-columns:2fr 1fr auto}}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
.head{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.tn{font-weight:800;color:var(--navy);font-size:1.05rem}
.stat{background:#FFE9D2;color:#B85A00;padding:3px 11px;border-radius:999px;font-size:.82rem;font-weight:700}
.stat.Delivered{background:#DDF3E1;color:#1B6B2F}
.kv{display:grid;grid-template-columns:110px 1fr;gap:3px 10px;margin:10px 0;font-size:.92rem}
.kv span:nth-child(odd){color:#6B7A94}
.kv span:nth-child(even){word-break:break-word}
.acts{display:flex;gap:6px;flex-wrap:wrap}
.acts button{flex:1;min-width:110px;padding:9px 6px;border-radius:9px;border:1.5px solid var(--line);background:#fff;font-weight:600;cursor:pointer;font-size:.85rem}
.acts button.cur{background:var(--navy);color:#fff;border-color:var(--navy)}
.msg{text-align:center;color:#6B7A94;padding:30px 0}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:11px 18px;border-radius:12px;display:none;z-index:9;max-width:90%}
.err{color:#C62828;font-size:.9rem}
.tabs button{padding:11px 4px;font-size:.85rem}
textarea{width:100%;padding:11px 13px;border:1.5px solid var(--line);border-radius:10px;font:inherit;font-family:ui-monospace,Menlo,monospace;font-size:.8rem}
.cred{background:#DDF3E1;border-color:#9ad3a6;white-space:pre-wrap;word-break:break-word}
.pw{display:flex;gap:6px;margin-top:10px}
.pw input{flex:1}
.hint{font-size:.8rem;color:#6B7A94;margin-top:6px}
</style>
</head>
<body>
<div id="loginView" class="login" hidden>
 <h1>Cholvo admin</h1>
 <form id="lf" style="display:grid;gap:12px">
  <div><label for="em">Admin email</label><input id="em" type="email" autocomplete="username" required></div>
  <div><label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password" required></div>
  <p class="err" id="lerr"></p>
  <button class="btn">Log in</button>
 </form>
</div>

<div id="appView" hidden>
 <div class="top"><b>Cholvo admin</b><button class="btn g" id="out">Log out</button></div>
 <div class="wrap">
  <div class="tabs"><button class="on" data-t="orders">Orders</button><button data-t="requests">Requests</button><button data-t="merchants">Merchants</button><button data-t="charges">Charges</button></div>
  <div id="ordersV">
   <div class="tools">
    <input id="q" placeholder="Search tracking number, name or phone" aria-label="Search">
    <select id="fs" aria-label="Filter by status"><option value="">All statuses</option></select>
    <button class="btn g" id="reload">Refresh</button>
   </div>
   <div id="olist"></div>
  </div>
  <div id="reqV" hidden><div id="credBox" class="card cred" hidden></div><div id="rlist"></div></div>
  <div id="merchV" hidden><div id="mlist"></div></div>
  <div id="chV" hidden>
   <p class="msg" style="padding:0 0 10px;text-align:left">These charge lists (cake, parcel, food) are shown only to logged-in, approved merchants. Edit the HTML below and press Save.</p>
   <textarea id="chText" rows="16" spellcheck="false"></textarea>
   <div class="acts" style="margin-top:10px"><button id="chSave" class="btn">Save charge lists</button><button id="chDef" class="btn g">Load default</button></div>
   <p class="hint" id="chInfo"></p>
  </div>
 </div>
</div>
<div class="toast" id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
const CFG={apiKey:'AIzaSyC5cZRg2y8uciG2IqCNfNUBbO1SdI-rxL4',authDomain:'chovo-35252.firebaseapp.com',projectId:'chovo-35252',appId:'1:324753082605:web:5b511ba890467441c524e4'};
const ADMIN='admin@cholvo.com';
const STEPS=['Order Received','Picked Up','On the Way','Dropped Off','Delivered'];
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
firebase.initializeApp(CFG);
const auth=firebase.auth(),db=firebase.firestore(),TS=firebase.firestore.FieldValue.serverTimestamp();
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const toast=t=>{const e=$('#toast');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',3000)};
const LABEL={vendor:'Vendor',name:'Name',phone:'Phone',pickup:'Pickup',drop:'Deliver to',customerName:'Customer name',customerPhone:'Customer phone',addr:'Address',product:'Product',from:'Collect from',ptype:'Parcel type',cod:'COD (৳)',date:'Order date',later:'Scheduled'};
let orders=[];

STEPS.forEach(s=>$('#fs').insertAdjacentHTML('beforeend',`<option>${s}</option>`));

auth.onAuthStateChanged(u=>{
 const ok=u&&u.email===ADMIN;
 if(u&&!ok){auth.signOut();$('#lerr').textContent='This account is not an admin.';return}
 $('#loginView').hidden=!!ok;$('#appView').hidden=!ok;
 if(ok)loadOrders();
});
$('#lf').onsubmit=async e=>{e.preventDefault();$('#lerr').textContent='';
 try{await auth.signInWithEmailAndPassword($('#em').value.trim(),$('#pw').value)}
 catch(err){$('#lerr').textContent='Wrong email or password.'}};
$('#out').onclick=()=>auth.signOut();

$$('.tabs button').forEach(b=>b.onclick=()=>{
 $$('.tabs button').forEach(x=>x.classList.toggle('on',x===b));
 const t=b.dataset.t;
 $('#ordersV').hidden=t!=='orders';$('#reqV').hidden=t!=='requests';$('#merchV').hidden=t!=='merchants';$('#chV').hidden=t!=='charges';
 ({orders:loadOrders,requests:loadRequests,merchants:loadMerchants,charges:loadCharges})[t]()});

async function loadOrders(){
 $('#olist').innerHTML='<p class="msg">Loading orders…</p>';
 try{const s=await db.collection('orders').orderBy('createdAt','desc').limit(200).get();
  orders=s.docs.map(d=>d.data());drawOrders()}
 catch(err){$('#olist').innerHTML='<p class="msg">Could not load orders. Check that the rules are published with your admin email.</p>'}}

function drawOrders(){
 const q=$('#q').value.trim().toLowerCase(),fs=$('#fs').value;
 const list=orders.filter(o=>(!fs||o.status===fs)&&(!q||(o.tn||'').toLowerCase().includes(q)||(o.phone||'').includes(q)||(o.customerPhone||'').includes(q)||(o.customerName||'').toLowerCase().includes(q)));
 if(!list.length){$('#olist').innerHTML='<p class="msg">No orders found.</p>';return}
 $('#olist').innerHTML=list.map(o=>{
  const when=o.createdAt?o.createdAt.toDate().toLocaleString():'';
  const kv=Object.keys(LABEL).filter(k=>o[k]!==undefined&&o[k]!=='').map(k=>`<span>${LABEL[k]}</span><span>${esc(o[k])}</span>`).join('');
  return `<div class="card"><div class="head"><span class="tn">${esc(o.tn)}</span><span class="stat ${esc(o.status)}">${esc(o.status)}</span></div>
  <small style="color:#6B7A94">${o.type==='order'?'Order anything':'Parcel booking'} · ${esc(when)}</small>
  <div class="kv">${kv}</div>
  <div class="acts">${STEPS.map(s=>`<button class="${s===o.status?'cur':''}" data-tn="${esc(o.tn)}" data-s="${s}">${s}</button>`).join('')}</div></div>`}).join('')}
$('#q').oninput=drawOrders;$('#fs').onchange=drawOrders;$('#reload').onclick=loadOrders;

$('#olist').onclick=async e=>{const b=e.target.closest('button[data-tn]');if(!b||b.classList.contains('cur'))return;
 const tn=b.dataset.tn,s=b.dataset.s,time=new Date().toLocaleString([], {day:'numeric',month:'short',hour:'numeric',minute:'2-digit'});
 b.disabled=true;
 try{const bt=db.batch();
  bt.update(db.doc('orders/'+tn),'status',s,'updatedAt',TS);
  bt.update(db.doc('tracking/'+tn),'status',s,'updatedAt',TS,new firebase.firestore.FieldPath('times',s),time);
  await bt.commit();
  const o=orders.find(x=>x.tn===tn);if(o)o.status=s;drawOrders();toast('Status updated: '+s)
 }catch(err){b.disabled=false;toast('Could not update. Try again.')}};

async function loadMerchants(){
 $('#mlist').innerHTML='<p class="msg">Loading merchants…</p>';
 try{const s=await db.collection('merchants').get();
  if(s.empty){$('#mlist').innerHTML='<p class="msg">No merchants have registered yet.</p>';return}
  $('#mlist').innerHTML=s.docs.map(d=>{const m=d.data();
   return `<div class="card"><div class="head"><span class="tn">${esc(m.phone)}</span><span class="stat">${m.blocked?'Blocked':'Active'}</span></div>${m.businessName?`<small style="color:#6B7A94">${esc(m.businessName)}</small>`:''}
   <div class="acts" style="margin-top:10px"><button data-uid="${d.id}" data-b="${m.blocked?0:1}">${m.blocked?'Unblock':'Block'} merchant</button></div></div>`}).join('')}
 catch(err){$('#mlist').innerHTML='<p class="msg">Could not load merchants.</p>'}}
$('#mlist').onclick=async e=>{const b=e.target.closest('button[data-uid]');if(!b)return;
 b.disabled=true;
 try{await db.doc('merchants/'+b.dataset.uid).update({blocked:b.dataset.b==='1'});toast('Merchant updated');loadMerchants()}
 catch(err){b.disabled=false;toast('Could not update merchant.')}};

// ===== Merchant registration requests =====
const RLABEL={businessName:'Business',ownerFirst:'Owner first name',ownerLast:'Owner last name',businessType:'Type',branches:'Branches',email:'Email',mobile:'Mobile',businessPhone:'Business phone'};
const randPass=()=>{const n=new Uint32Array(1);crypto.getRandomValues(n);return String(100000+n[0]%900000)};
let reqs=[];
async function loadRequests(){
 $('#rlist').innerHTML='<p class="msg">Loading requests…</p>';
 try{const s=await db.collection('merchantRequests').orderBy('createdAt','desc').limit(200).get();
  reqs=s.docs.map(d=>({id:d.id,...d.data()}));drawRequests()}
 catch(err){$('#rlist').innerHTML='<p class="msg">Could not load requests. Publish the latest Firestore rules first.</p>'}}
function drawRequests(){
 if(!reqs.length){$('#rlist').innerHTML='<p class="msg">No registration requests yet.</p>';return}
 const order={pending:0,approved:1,rejected:2};
 const list=[...reqs].sort((x,y)=>(order[x.status]??3)-(order[y.status]??3));
 $('#rlist').innerHTML=list.map(r=>{
  const when=r.createdAt?r.createdAt.toDate().toLocaleString():'';
  const kv=Object.keys(RLABEL).filter(k=>r[k]!==undefined&&r[k]!=='').map(k=>`<span>${RLABEL[k]}</span><span>${esc(r[k])}</span>`).join('');
  const acts=r.status==='pending'?`<div class="pw"><input id="pw-${r.id}" value="${randPass()}" minlength="6" aria-label="Password for this merchant"><button class="btn" data-ap="${r.id}">Approve</button></div><div class="acts" style="margin-top:8px"><button data-rj="${r.id}">Reject</button></div><p class="hint">Login phone = mobile number above. Edit the password if you like (min 6 characters), then press Approve.</p>`:'';
  return `<div class="card"><div class="head"><span class="tn">${esc(r.businessName)}</span><span class="stat ${r.status==='approved'?'Delivered':''}">${esc(r.status)}</span></div><small style="color:#6B7A94">${esc(when)}</small><div class="kv">${kv}</div>${acts}</div>`}).join('')}
$('#rlist').onclick=async e=>{
 const ap=e.target.closest('button[data-ap]'),rj=e.target.closest('button[data-rj]');
 if(rj){if(!confirm('Reject this registration?'))return;rj.disabled=true;
  try{await db.doc('merchantRequests/'+rj.dataset.rj).update({status:'rejected'});const r=reqs.find(x=>x.id===rj.dataset.rj);if(r)r.status='rejected';drawRequests();toast('Rejected')}
  catch(err){rj.disabled=false;toast('Could not update.')}return}
 if(!ap)return;
 const id=ap.dataset.ap,r=reqs.find(x=>x.id===id),pass=$('#pw-'+id).value.trim();
 if(pass.length<6){toast('Password must be at least 6 characters.');return}
 ap.disabled=true;
 try{
  // second Firebase app, so creating the merchant login does not sign the admin out
  const sec=firebase.apps.find(x=>x.name==='sec')||firebase.initializeApp(CFG,'sec'),sa=firebase.auth(sec);
  const c=await sa.createUserWithEmailAndPassword(r.mobile+'@cholvo.app',pass);
  const uid=c.user.uid;await sa.signOut();
  await db.doc('merchants/'+uid).set({phone:r.mobile,businessName:r.businessName,ownerFirst:r.ownerFirst||'',ownerLast:r.ownerLast||'',businessType:r.businessType||'',branches:r.branches||1,email:r.email||'',businessPhone:r.businessPhone||r.mobile,blocked:false,createdAt:TS});
  await db.doc('merchantRequests/'+id).update({status:'approved',merchantUid:uid});
  r.status='approved';drawRequests();
  const box=$('#credBox');box.hidden=false;
  box.textContent='Approved: '+r.businessName+'\nPhone: '+r.mobile+'\nPassword: '+pass+'\n\nSend these login details to the merchant. The password is not saved anywhere, so copy it now.';
  const cp=document.createElement('button');cp.className='btn';cp.style.marginTop='10px';cp.textContent='Copy message';
  cp.onclick=()=>{navigator.clipboard.writeText('Cholvo merchant login\nPhone: '+r.mobile+'\nPassword: '+pass+'\nLogin: '+location.origin).then(()=>toast('Copied'),()=>toast('Copy failed'))};
  box.appendChild(document.createElement('br'));box.appendChild(cp);window.scrollTo(0,0);
 }catch(err){ap.disabled=false;toast(err.code==='auth/email-already-in-use'?'This mobile number already has a login.':err.code==='auth/weak-password'?'Password is too weak.':'Could not approve. Try again.')}};

// ===== Merchant-only charge lists =====
const DEFAULT_CHARGES=`  <span class="section-kicker">DELIVERY CHARGE LIST</span><h2>Cholvo delivery charge list</h2>

  <div class="ch-card">
   <h3>🎂 Cake delivery charge list</h3>

    <tbody>
      <tr><td>½ - ১ পাউন্ড</td><td>১০০/-</td><td>১০ টাকা</td></tr>

      <tr><td>২½ - ৩ পাউন্ড</td><td>১৪০/-</td><td>১০ টাকা</td></tr>
      <tr><td>৩½ - ৪ পাউন্ড</td><td>১৬০/-</td><td>১০ টাকা</td></tr>
      <tr><td>৪½ - ৫ পাউন্ড</td><td>২০০/-</td><td>১০ টাকা</td></tr>

   <div class="ch-note"><b>⭕ টিয়ার কেক:</b> এক পাউন্ড থেকে শুরু করে প্রত্যেকটা টু-টিয়ার কেক এ চার্জের সাথে এক্সট্রা ২০ টাকা এড হবে.! এবং সে ক্ষেত্রে যদি থ্রী-টিয়ার কেক হয় তাহলে ৪০ টাকা ফোর্থ টিয়ার হলে ৬০ টাকা, এবং যদি অতিরিক্ত হাইড হয়ে যায় কিংবা বক্স অতিরিক্ত বড় সাইজের হয়ে গেলে সে ক্ষেত্রে আরো বেড়ে যাবে.!</div>
   <div class="ch-note"><b>⭕ নোট:</b> উপরের লিখিত সম্পূর্ণ চার্জটা প্রযোজ্য হবে :- কাপ্তাই রাস্তার মাথা / অক্সিজেন / সিটি গেইট / হালিশহর এ ব্লক বি ব্লক / বন্দর কাস্টম হাউস পর্যন্ত / এই লোকেশনের পরে যদি কোন কেক ডেলিভারি হয় তাহলে রেগুলার চার্জের সাথে ১০০ টাকা এক্সট্রা এড হবে এবং সেটা কেকের পাউন্ড এর উপর ডিপেন্ড করে আরো বাড়তে পারে।<br>(এবং কেক যদি অতিরিক্ত বড় হওয়ার কারণে কিংবা বক্সের সমস্যা হওয়ার জন্য লোকাল কোন ট্রান্সপোর্ট এর মাধ্যমে ডেলিভারি করতে হয় তাহলে ডেলিভারি চার্জের সাথে লোকাল ট্রান্সপোর্ট এর ভাড়া ৬০% পে করতে হবে। সেটা আপনি করেন কিংবা আপনার কাস্টমার যে কেউ একজন করলেই হচ্ছে) 💥</div>
   <div class="ch-note soft">⭕ Cholvobd সবসময় কাস্টমার অনুযায়ী সার্ভিস প্রদান করে থাকে।</div>
  </div>

  <div class="ch-card">

async function loadCharges(){
 $('#chInfo').textContent='Loading…';
 try{const d=await db.doc('private/charges').get();
  if(d.exists&&d.data().html){$('#chText').value=d.data().html;$('#chInfo').textContent='Published. Merchants see this after login.'}
  else{$('#chText').value=DEFAULT_CHARGES;$('#chInfo').textContent='Not published yet. Press Save to publish this list for merchants.'}}
 catch(err){$('#chInfo').textContent='Could not load. Publish the latest Firestore rules first.'}}
$('#chDef').onclick=()=>{$('#chText').value=DEFAULT_CHARGES;$('#chInfo').textContent='Default loaded. Press Save to publish.'};
$('#chSave').onclick=async()=>{const b=$('#chSave');b.disabled=true;
 try{await db.doc('private/charges').set({html:$('#chText').value,updatedAt:TS});$('#chInfo').textContent='Saved. Merchants will see it after login.';toast('Charge lists saved')}
 catch(err){toast('Could not save.')}b.disabled=false};
</script>
